# Four-validator Hyperledger Besu QBFT network for the evoo-carbon-ledger prototype.
# Run ./setup.sh first. Node 1 exposes JSON-RPC on http://127.0.0.1:8545.
x-besu-node: &besu-node
  image: ${BESU_IMAGE:-hyperledger/besu:latest}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ./nodes:/opt/network
  restart: unless-stopped

services:
  node1:
    <<: *besu-node
    command: >-
      --data-path=/opt/network/node1/data --p2p-host=172.16.240.11 --p2p-port=30303
      --rpc-http-port=8545
      --genesis-file=/opt/network/genesis.json --sync-mode=FULL --min-gas-price=0
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
      --host-allowlist=* --rpc-http-cors-origins=all
    ports: ["8545:8545"]
    networks:
      qbft:
        ipv4_address: 172.16.240.11
  node2:
    <<: *besu-node
    command: >-
      --data-path=/opt/network/node2/data --p2p-host=172.16.240.12 --p2p-port=30303
      --bootnodes=${BOOTNODE}
      --genesis-file=/opt/network/genesis.json --sync-mode=FULL --min-gas-price=0
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
      --host-allowlist=* --rpc-http-cors-origins=all
    networks:
      qbft:
        ipv4_address: 172.16.240.12
  node3:
    <<: *besu-node
    command: >-
      --data-path=/opt/network/node3/data --p2p-host=172.16.240.13 --p2p-port=30303
      --bootnodes=${BOOTNODE}
      --genesis-file=/opt/network/genesis.json --sync-mode=FULL --min-gas-price=0
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
      --host-allowlist=* --rpc-http-cors-origins=all
    networks:
      qbft:
        ipv4_address: 172.16.240.13
  node4:
    <<: *besu-node
    command: >-
      --data-path=/opt/network/node4/data --p2p-host=172.16.240.14 --p2p-port=30303
      --bootnodes=${BOOTNODE}
      --genesis-file=/opt/network/genesis.json --sync-mode=FULL --min-gas-price=0
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
      --host-allowlist=* --rpc-http-cors-origins=all
    networks:
      qbft:
        ipv4_address: 172.16.240.14

networks:
  qbft:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.240.0/24
